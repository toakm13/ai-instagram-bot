<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#f8f4e8"/><rect width="1080" height="360" fill="#0c3d35"/><text x="55" y="80" font-family="Georgia" font-size="48" font-weight="700" fill="white">Evidyarthee</text><text x="58" y="120" font-family="Arial" font-size="19" letter-spacing="5" fill="#d7b24c">LEARN | INVEST | GROW</text><text x="55" y="205" font-family="Arial" font-size="66" font-weight="900" fill="white">POST-MARKET</text><text x="55" y="270" font-family="Arial" font-size="66" font-weight="900" fill="#d7a62a">WRAP</text><text x="60" y="315" font-family="Arial" font-size="22" letter-spacing="3" fill="white">18 SEPTEMBER 2026 • FRIDAY</text><text x="700" y="90" font-family="Georgia" font-size="22" fill="white">KNOWLEDGE TODAY.</text><text x="700" y="120" font-family="Georgia" font-size="22" fill="white">A BRIGHTER TOMORROW.</text><rect x="35" y="390" width="1010" height="170" rx="24" fill="white" stroke="#d9d2c0" stroke-width="2"/><text x="65" y="430" font-family="Arial" font-size="20" font-weight="700" fill="#0c3d35">MARKET SNAPSHOT</text><text x="65" y="485" font-family="Arial" font-size="18" font-weight="700" fill="#0c3d35">NIFTY 50</text><text x="65" y="525" font-family="Arial" font-size="36" font-weight="800" fill="#142f3e">23,346.40</text><text x="280" y="525" font-family="Arial" font-size="22" fill="#138a62">+75.80 (+0.33%)</text><line x1="520" y1="450" x2="520" y2="540" stroke="#ddd"/><text x="550" y="485" font-family="Arial" font-size="18" font-weight="700" fill="#0c3d35">SENSEX</text><text x="550" y="525" font-family="Arial" font-size="36" font-weight="800" fill="#142f3e">74,294.96</text><text x="775" y="525" font-family="Arial" font-size="22" fill="#c23a3a">-19.63 (-0.03%)</text><g font-family="Arial"><rect x="35" y="590" width="320" height="440" rx="24" fill="#0c3d35"/><text x="65" y="645" font-size="25" font-weight="800" fill="#d7b24c">01 • WHAT HAPPENED</text><text x="65" y="710" font-size="21" fill="white">Nifty 50 gained 0.33%,</text><text x="65" y="742" font-size="21" fill="white">while Sensex slipped 0.03%.</text><text x="65" y="795" font-size="21" fill="white">Oil eased and the NSE IPO</text><text x="65" y="827" font-size="21" fill="white">was fully subscribed by</text><text x="65" y="859" font-size="21" fill="white">its second day.</text><text x="65" y="925" font-size="19" fill="#d7b24c">A mixed session, not a</text><text x="65" y="955" font-size="19" fill="#d7b24c">uniform market move.</text><rect x="380" y="590" width="320" height="440" rx="24" fill="white" stroke="#d9d2c0" stroke-width="2"/><text x="410" y="645" font-size="25" font-weight="800" fill="#0c3d35">02 • WHY IT MATTERED</text><text x="410" y="710" font-size="20" fill="#142f3e">Crude prices remain</text><text x="410" y="742" font-size="20" fill="#142f3e">important for India's</text><text x="410" y="774" font-size="20" fill="#142f3e">inflation and import bill.</text><text x="410" y="830" font-size="20" fill="#142f3e">IPO demand can absorb</text><text x="410" y="862" font-size="20" fill="#142f3e">liquidity from secondary</text><text x="410" y="894" font-size="20" fill="#142f3e">markets.</text><text x="410" y="950" font-size="18" fill="#0c3d35">Global rates and oil</text><text x="410" y="978" font-size="18" fill="#0c3d35">remain external cues.</text><rect x="725" y="590" width="320" height="440" rx="24" fill="#fff8e5" stroke="#d7b24c" stroke-width="2"/><text x="755" y="645" font-size="25" font-weight="800" fill="#0c3d35">03 • WHAT INVESTORS</text><text x="755" y="678" font-size="25" font-weight="800" fill="#0c3d35">CAN LEARN</text><text x="755" y="735" font-size="20" fill="#142f3e">Different benchmarks</text><text x="755" y="767" font-size="20" fill="#142f3e">can move differently</text><text x="755" y="799" font-size="20" fill="#142f3e">because weights and</text><text x="755" y="831" font-size="20" fill="#142f3e">constituents differ.</text><text x="755" y="887" font-size="20" fill="#142f3e">Look beyond one</text><text x="755" y="919" font-size="20" fill="#142f3e">headline index when</text><text x="755" y="951" font-size="20" fill="#142f3e">reading the market.</text><rect x="35" y="1060" width="1010" height="150" rx="24" fill="#e8f0eb"/><text x="65" y="1105" font-size="22" font-weight="800" fill="#0c3d35">FLOW WATCH • 17 SEPTEMBER</text><text x="65" y="1155" font-size="22" fill="#142f3e">FII NET SELLING: <tspan fill="#c23a3a" font-weight="800">₹3,208.76 Cr</tspan></text><text x="540" y="1155" font-size="22" fill="#142f3e">DII NET BUYING: <tspan fill="#138a62" font-weight="800">₹3,617.75 Cr</tspan></text><text x="35" y="1265" font-size="18" fill="#142f3e">Sources: Reuters; Upstox • Educational content only. Not investment advice.</text><text x="800" y="1265" font-size="18" fill="#0c3d35">LEARN | INVEST | GROW</text></g></svg>
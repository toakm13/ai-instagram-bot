<g font-family="Arial,sans-serif">
<rect x="35" y="280" width="320" height="190" rx="18" fill="#ffffff" stroke="#d7e2df" stroke-width="2"/><text x="60" y="325" font-size="23" font-weight="700" fill="#0d3b32">NIFTY 50</text><text x="60" y="385" font-size="42" font-weight="800" fill="#102f46">23,346.40</text><text x="60" y="425" font-size="23" fill="#138a62">+75.80 (+0.33%)</text>
<rect x="380" y="280" width="320" height="190" rx="18" fill="#ffffff" stroke="#d7e2df" stroke-width="2"/><text x="405" y="325" font-size="23" font-weight="700" fill="#0d3b32">SENSEX</text><text x="405" y="385" font-size="42" font-weight="800" fill="#102f46">74,294.96</text><text x="405" y="425" font-size="23" fill="#c53b3b">-19.63 (-0.03%)</text>
<rect x="725" y="280" width="320" height="190" rx="18" fill="#ffffff" stroke="#d7e2df" stroke-width="2"/><text x="750" y="325" font-size="23" font-weight="700" fill="#0d3b32">BRENT CRUDE</text><text x="750" y="385" font-size="42" font-weight="800" fill="#102f46">~$103.4</text><text x="750" y="425" font-size="23" fill="#102f46">per barrel</text>
<rect x="35" y="500" width="1010" height="260" rx="20" fill="#0d3b32"/><text x="65" y="550" font-size="29" font-weight="800" fill="#d8b45b">1  WHAT HAPPENED</text>
<text x="65" y="600" font-size="25" fill="#ffffff">Nifty 50 gained 0.33%, while Sensex slipped 0.03%.</text><text x="65" y="645" font-size="25" fill="#ffffff">The session ended mixed, with selective buying across sectors.</text><text x="65" y="690" font-size="25" fill="#ffffff">The NSE IPO was fully subscribed by its second day.</text><text x="65" y="735" font-size="25" fill="#ffffff">Brent crude eased to around $103.4 a barrel.</text>
<rect x="35" y="790" width="490" height="300" rx="20" fill="#ffffff" stroke="#d7e2df" stroke-width="2"/><text x="65" y="840" font-size="29" font-weight="800" fill="#0d3b32">2  WHY IT MATTERED</text>
<text x="65" y="890" font-size="24" fill="#102f46">Oil prices remain an important cue</text><text x="65" y="925" font-size="24" fill="#102f46">for inflation and India's import bill.</text><text x="65" y="975" font-size="24" fill="#102f46">IPO demand can also temporarily affect</text><text x="65" y="1010" font-size="24" fill="#102f46">liquidity available to secondary markets.</text>
<rect x="555" y="790" width="490" height="300" rx="20" fill="#fff8e6" stroke="#e1c76b" stroke-width="2"/><text x="585" y="840" font-size="29" font-weight="800" fill="#0d3b32">3  WHAT INVESTORS CAN LEARN</text>
<text x="585" y="895" font-size="24" fill="#102f46">Different benchmarks can move differently</text><text x="585" y="930" font-size="24" fill="#102f46">because their constituents and weights differ.</text><text x="585" y="980" font-size="24" fill="#102f46">Look beyond one headline index when</text><text x="585" y="1015" font-size="24" fill="#102f46">interpreting a market session.</text>

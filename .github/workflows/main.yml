name: AI Market Content Bot

on:
  workflow_dispatch:

  schedule:
    # Morning market analysis (9:00 AM IST)
    - cron: "30 3 * * 1-5"

    # Meme post (1:30 PM IST)
    - cron: "0 8 * * 1-5"

    # Evening market wrap (7:00 PM IST)
    - cron: "30 13 * * 1-5"

    # Saturday weekly analysis (11:00 AM IST)
    - cron: "30 5 * * 6"

    # Sunday macro + next week outlook (11:00 AM IST)
    - cron: "30 5 * * 0"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI market content generator
        run: |
          python main.py

      - name: Create AI reel / short video
        run: |
          python video.py

name: AI Market Content Bot

on:
  workflow_dispatch:

  schedule:
    # Morning analysis
    - cron: "30 3 * * 1-5"

    # Meme post
    - cron: "0 8 * * 1-5"

    # Evening wrap
    - cron: "30 13 * * 1-5"

    # Saturday weekly analysis
    - cron: "30 5 * * 6"

    # Sunday macro outlook
    - cron: "30 5 * * 0"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market content generator
        run: |
          python main.py

      - name: Create reel video
        run: |
          python video.py

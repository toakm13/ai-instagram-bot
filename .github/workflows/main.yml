name: Evidyarthee Production Engine

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run"
        required: true
        default: educational
        type: choice
        options:
          - pre-market
          - educational
          - post-market
          - news
          - meme
  schedule:
    # All times UTC. India is UTC+5:30.
    # 08:45 IST pre-market, 13:30 IST educational, 16:30 IST post-market.
    - cron: "15 3 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "0 11 * * 1-5"
    # Material-news watcher, every 10 minutes on weekdays.
    - cron: "*/10 * * * 1-5"
    # Weekend growth layer: Saturday finance meme at 11:30 IST.
    - cron: "0 6 * * 6"

concurrency:
  group: evidyarthee-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
      METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
      METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      EVIDYARTHEE_EMERGENCY_KILL_SWITCH: ${{ secrets.EVIDYARTHEE_EMERGENCY_KILL_SWITCH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate production secrets
        run: |
          test -n "$METRICOOL_USER_TOKEN" || { echo "::error::METRICOOL_USER_TOKEN is missing"; exit 1; }
          test -n "$METRICOOL_USER_ID" || { echo "::error::METRICOOL_USER_ID is missing"; exit 1; }
          test -n "$METRICOOL_BLOG_ID" || { echo "::error::METRICOOL_BLOG_ID is missing"; exit 1; }
          test -n "$EVIDYARTHEE_EMERGENCY_KILL_SWITCH" || { echo "::error::EVIDYARTHEE_EMERGENCY_KILL_SWITCH is missing"; exit 1; }

      - name: Select lane
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.schedule }}
          MANUAL_LANE: ${{ inputs.lane }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "lane=$MANUAL_LANE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_ACTION" = "15 3 * * 1-5" ]; then
            echo "lane=pre-market" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_ACTION" = "0 8 * * 1-5" ]; then
            echo "lane=educational" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_ACTION" = "0 11 * * 1-5" ]; then
            echo "lane=post-market" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_ACTION" = "0 6 * * 6" ]; then
            echo "lane=meme" >> "$GITHUB_OUTPUT"
          else
            echo "lane=news" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Evidyarthee research → validate → publish
        if: ${{ steps.lane.outputs.lane != 'meme' }}
        run: python evidyarthee_live.py "${{ steps.lane.outputs.lane }}"

      - name: Run Evidyarthee meme engine
        if: ${{ steps.lane.outputs.lane == 'meme' }}
        run: python meme_engine.py

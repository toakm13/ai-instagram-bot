name: AI Market Content Bot

on:
  workflow_dispatch:
    inputs:
      content_type:
        description: "Content to publish"
        required: true
        default: image
        type: choice
        options:
          - image
          - reel

  schedule:
    - cron: "30 3 * * *"

concurrency:
  group: ai-market-content-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      CONTENT_TYPE: ${{ inputs.content_type || 'image' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$PAGE_ACCESS_TOKEN" || { echo "::error::PAGE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$IG_USER_ID" || { echo "::error::IG_USER_ID is missing"; exit 1; }

      - name: Generate market content
        run: python main.py

      - name: Generate Reel when requested
        if: ${{ env.CONTENT_TYPE == 'reel' }}
        run: python video.py

      - name: Commit generated media
        id: media_commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add post.png chart.png caption.txt reel.mp4

          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Auto-generated market content"
            git push origin HEAD:main
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        env:
          MEDIA_SHA: ${{ steps.media_commit.outputs.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          META_GRAPH_API_VERSION: v26.0
        run: python post.py

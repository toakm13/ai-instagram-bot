name: AI Market Content Bot

on:
  workflow_dispatch:
    inputs:
      content_type:
        description: "Content to publish"
        required: true
        default: image
        type: choice
        options:
          - image
          - reel

  schedule:
    - cron: "30 3 * * *"

concurrency:
  group: ai-market-content-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      CONTENT_TYPE: ${{ inputs.content_type || 'image' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$PAGE_ACCESS_TOKEN" || { echo "::error::PAGE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$IG_USER_ID" || { echo "::error::IG_USER_ID is missing"; exit 1; }

      - name: Validate Meta/Instagram authentication
        env:
          META_GRAPH_API_VERSION: v26.0
        run: python post.py --validate-only

      - name: Run regression tests
        run: pytest -q

      - name: Generate market content
        run: python main.py

      - name: Generate Reel when requested
        if: ${{ env.CONTENT_TYPE == 'reel' }}
        run: python video.py

      - name: Commit generated media
        id: media_commit
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Rebase before creating the generated-media commit so the public
          # commit is based on the newest main branch.
          git fetch origin main
          git rebase origin/main

          git add post.png chart.png caption.txt
          if [ -f reel.mp4 ]; then
            git add reel.mp4
          fi

          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Auto-generated market content"
          fi

          # Push with a small retry loop for a remote update that arrives
          # between fetch/rebase and push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not push generated media after 3 attempts."
              exit 1
            fi

            git fetch origin main
            git rebase origin/main
          done

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        env:
          MEDIA_SHA: ${{ steps.media_commit.outputs.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          META_GRAPH_API_VERSION: v26.0
        run: python post.py

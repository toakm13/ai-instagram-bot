name: Evidyarthee Daily Meme Engine

on:
  workflow_dispatch:
  schedule:
    # Start before the locked 7:30 PM IST publication slot.
    - cron: "25 19 * * *"
      timezone: "Asia/Kolkata"

concurrency:
  group: evidyarthee-daily-meme
  cancel-in-progress: false

jobs:
  meme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
      METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
      METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
      EVIDYARTHEE_EMERGENCY_KILL_SWITCH: ${{ secrets.EVIDYARTHEE_EMERGENCY_KILL_SWITCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          test -n "$METRICOOL_USER_TOKEN" || { echo "::error::METRICOOL_USER_TOKEN missing"; exit 1; }
          test -n "$METRICOOL_USER_ID" || { echo "::error::METRICOOL_USER_ID missing"; exit 1; }
          test -n "$METRICOOL_BLOG_ID" || { echo "::error::METRICOOL_BLOG_ID missing"; exit 1; }
          test -n "$EVIDYARTHEE_EMERGENCY_KILL_SWITCH" || { echo "::error::EVIDYARTHEE_EMERGENCY_KILL_SWITCH missing"; exit 1; }

      - name: Generate and publish daily meme
        run: python meme_engine_v2.py
